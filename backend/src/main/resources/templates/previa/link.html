<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Prévia do link</title>
<style th:utext="${fontes}"></style>
<!-- Imagem 1200×630 que o WhatsApp (e LinkedIn, Telegram, iMessage) mostra quando o link é
     enviado. Mesma linguagem da capa do relatório: fundo escuro, a curva como assinatura. -->
<style th:inline="css">
  :root {
    --tinta: [(${t.tinta})]; --fundo: [(${t.fundo})]; --destaque: [(${t.destaqueSobreTinta})];
    --brilho: [(${t.tintaBrilho})];
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Instrument Sans', system-ui, sans-serif; color: var(--fundo);
    background:
      radial-gradient(60% 80% at 76% 34%, color-mix(in srgb, var(--destaque) 20%, transparent) 0%, transparent 62%),
      radial-gradient(90% 110% at 0% 0%, var(--brilho) 0%, transparent 58%),
      var(--tinta);
    -webkit-font-smoothing: antialiased;
  }
  .topo { position: absolute; top: 52px; left: 64px; right: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .marca { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .selo { display: flex; align-items: center; height: 76px; padding: 0 22px; border-radius: 20px; background: #fff; box-shadow: 0 18px 40px -22px rgba(0,0,0,0.55); }
  .selo img { display: block; max-height: 48px; max-width: 320px; }
  .monograma {
    display: grid; place-items: center; width: 76px; height: 76px; border-radius: 20px; background: var(--destaque); color: var(--tinta);
    font: 700 30px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em;
  }
  .nome { font: 600 28px/1.15 'Instrument Sans', sans-serif; max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .produto { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
  .credito { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; color: color-mix(in srgb, var(--fundo) 72%, transparent); white-space: nowrap; }

  .rotulo { position: absolute; left: 64px; top: 188px; font-size: 17px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--destaque); }
  h1 {
    position: absolute; left: 64px; top: 222px; width: 590px;
    font-family: 'Bricolage Grotesque', sans-serif; font-variation-settings: 'opsz' 96; font-weight: 700; font-stretch: 84%;
    font-size: 80px; line-height: 0.95; letter-spacing: -0.015em; text-wrap: balance;
  }
  .fatos { position: absolute; left: 64px; bottom: 50px; display: flex; flex-direction: column; gap: 10px; font-size: 22px; font-weight: 500; color: color-mix(in srgb, var(--fundo) 86%, transparent); }
  .fatos span { display: flex; align-items: center; gap: 12px; }
  .fatos svg { flex: none; color: var(--destaque); }

  svg.curva { position: absolute; right: 36px; bottom: 26px; width: 700px; height: 450px; overflow: visible; }
  .rot { font: 600 15px 'Instrument Sans', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; fill: var(--fundo); fill-opacity: 0.55; }
  .balao { font: 600 19px 'Instrument Sans', sans-serif; fill: var(--tinta); }
</style>
</head>
<body>
  <header class="topo">
    <div class="marca">
      <th:block th:if="${empresa != null}">
        <div th:if="${logo != null}" class="selo"><img th:src="${logo}" alt=""></div>
        <div th:if="${logo == null}" class="monograma" th:text="${sigla}">CH</div>
        <span th:if="${logo == null or pedeNome}" class="nome" th:text="${empresa}">Construtora Horizonte</span>
      </th:block>
      <div th:if="${empresa == null}" class="produto">
        <svg width="40" height="40" viewBox="0 0 26 26" aria-hidden="true">
          <rect width="26" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.12"/>
          <path d="M5 19 C 9 19, 9 8, 13 8 S 17 8, 21 12" fill="none" th:attr="stroke=${t.destaqueSobreTinta}" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        Diagnóstico do Líder
      </div>
    </div>
    <div th:if="${empresa != null}" class="credito">
      <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true">
        <rect width="26" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.12"/>
        <path d="M5 19 C 9 19, 9 8, 13 8 S 17 8, 21 12" fill="none" th:attr="stroke=${t.destaqueSobreTinta}" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      Diagnóstico do Líder
    </div>
  </header>

  <p class="rotulo">Diagnóstico de carreira para líderes</p>
  <h1>Em que ponto da curva está a sua carreira?</h1>

  <div class="fatos">
    <span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>
      2 minutos
    </span>
    <span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linejoin="round"/></svg>
      Resultado em PDF no seu e-mail
    </span>
  </div>

  <svg class="curva" th:with="c=${c}" th:attr="viewBox=|0 0 ${c.largura} ${c.altura}|" aria-hidden="true">
    <defs>
      <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" th:attr="stop-color=${t.destaqueSobreTinta}" stop-opacity="0.26"/>
        <stop offset="1" th:attr="stop-color=${t.destaqueSobreTinta}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <line x1="10" th:attr="x2=${c.largura - 10},y1=${c.base},y2=${c.base}" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <path th:attr="d=${c.area}" fill="url(#area)"/>
    <path th:attr="d=${c.proximaCurva}" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path th:attr="d=${c.curva},stroke=${t.destaqueSobreTinta}" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g th:with="x=${c.voce.x},y=${c.voce.y}">
      <line th:attr="x1=${x},x2=${x},y1=${y + 20},y2=${c.base}" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 6"/>
      <circle th:attr="cx=${x},cy=${y}" r="26" th:fill="${t.destaqueSobreTinta}" fill-opacity="0.22"/>
      <circle th:attr="cx=${x},cy=${y},fill=${t.destaqueSobreTinta},stroke=${t.tinta}" r="12" stroke-width="5"/>
      <rect th:attr="x=${x - 88},y=${y - 76},fill=${t.fundo}" width="176" height="40" rx="20"/>
      <text class="balao" text-anchor="middle" th:attr="x=${x},y=${y - 49}">Você está aqui?</text>
    </g>

    <text class="rot" text-anchor="middle" th:attr="x=${c.subida.x},y=${c.subida.y}" th:text="${c.subida.texto}">Subida</text>
    <text class="rot" text-anchor="middle" th:attr="x=${c.plato.x},y=${c.plato.y}" th:text="${c.plato.texto}">Platô</text>
    <text class="rot" text-anchor="middle" th:attr="x=${c.queda.x},y=${c.queda.y}" th:text="${c.queda.texto}">Queda</text>
  </svg>
</body>
</html>
